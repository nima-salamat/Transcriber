[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transcriber-desktop"
version = "2.1.4"
description = "A local-first desktop audio transcription application built with PySide6 and Faster-Whisper"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Transcriber contributors" }]
keywords = ["speech-recognition", "transcription", "whisper", "offline", "pyside6"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: Qt",
  "Environment :: Win32 (MS Windows)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "PySide6>=6.7,<7",
  "platformdirs>=4,<5",
  "huggingface-hub>=0.27,<2",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.1,<2"]
cloud = ["google-cloud-speech>=2.27,<3"]
voice = ["sounddevice>=0.5,<1", "vosk>=0.3.45,<1"]
agent = ["mcp>=2,<3"]
documents = [
  "python-docx>=1.1,<2",
  "reportlab>=4,<5",
  "arabic-reshaper>=3,<4",
  "python-bidi>=0.6,<1",
]
dev = [
  "pytest>=8,<10",
  "pytest-qt>=4.4,<5",
  "ruff>=0.11,<1",
]
packaging = ["pyinstaller>=6.10,<7"]

[project.scripts]
transcriber = "transcriber.__main__:main"
transcriber-mcp = "transcriber.mcp_server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
transcriber = ["assets/icons/*.svg", "assets/icons/LICENSE.txt"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
