name: Transcriber CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python 3.12 · pytest · Qt offscreen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
      PYTHONFAULTHANDLER: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libgl1-mesa-dri libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 libxcb-xinerama0 libpulse0 libasound2t64
          ldconfig -p | grep -E 'libEGL.so.1|libGL.so.1'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade "setuptools>=69"
          python -m pip install -e ".[dev,documents]"
      - name: Ruff lint
        run: python -m ruff check src tests
      - name: Ruff format check
        run: |
          python -m ruff format --check src/transcriber/audio/imports.py
          python -m ruff format --check src/transcriber/ui/components/workspace_popups.py
          python -m ruff format --check tests/unit/test_media_import.py
          python -m ruff format --check tests/unit/test_dispatcher_future_lifecycle.py
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Build and validate wheel
        run: |
          python -m pip install wheel build
          python -m build --wheel --no-isolation
          python -m pip install --no-deps --target "$RUNNER_TEMP/transcriber-wheel-check" dist/*.whl
      - name: Run unit, integration and UI tests
        run: python -X faulthandler -m pytest -q

  windows-package:
    name: Windows GUI package · no console window
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build the Windows desktop application
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Could not install Inno Setup 6." }
          .\scripts\build_windows.ps1
      - name: Verify the per-user installer was created
        shell: pwsh
        run: |
          $Version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          $Installer = "release/Transcriber-Setup-$Version-x64.exe"
          if (-not (Test-Path $Installer)) { throw "Missing installer: $Installer" }
          if ((Get-Item $Installer).Length -lt 10MB) { throw "Installer output is unexpectedly small." }
      - name: Test hidden command-process settings
        run: python -m pip install --upgrade ".[dev]"
      - name: Run Windows process and packaging tests
        run: python -m pytest -q tests/unit/test_windows_process_launch.py tests/unit/test_audio_processing_no_console.py
      - name: Verify executable uses the Windows GUI subsystem
        shell: pwsh
        run: |
          @'
          import struct
          from pathlib import Path

          executable = Path("dist/Transcriber/Transcriber.exe")
          data = executable.read_bytes()
          pe_offset = struct.unpack_from("<I", data, 0x3C)[0]
          if data[pe_offset:pe_offset + 4] != b"PE\0\0":
              raise SystemExit("Invalid PE executable")
          optional_header = pe_offset + 24
          subsystem = struct.unpack_from("<H", data, optional_header + 68)[0]
          if subsystem != 2:
              raise SystemExit(f"Expected Windows GUI subsystem (2), got {subsystem}")
          print(f"Verified GUI subsystem for {executable}")
          '@ | python -
