name: Transcriber CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    name: Python 3.12 · pytest · Qt offscreen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
      PYTHONFAULTHANDLER: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libgl1-mesa-dri libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 libxcb-xinerama0 libpulse0 libasound2t64
          ldconfig -p | grep -E 'libEGL.so.1|libGL.so.1'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,documents]"
      - name: Apply safe Ruff fixes on target branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/modern-modular-transcriber'
        run: |
          python -m ruff check --fix src tests || true
          if ! git diff --quiet -- src tests; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src tests
            git commit -m "style: apply safe Ruff lint fixes"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Ruff lint
        run: python -m ruff check src tests
      - name: Ruff format check
        run: |
          python -m ruff format --check src/transcriber/audio/imports.py
          python -m ruff format --check src/transcriber/ui/components/workspace_popups.py
          python -m ruff format --check tests/unit/test_media_import.py
          python -m ruff format --check tests/unit/test_dispatcher_future_lifecycle.py
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Build and validate wheel
        run: |
          python -m pip install build
          python -m build --wheel --no-isolation
          python -m pip install --no-deps --target "$RUNNER_TEMP/transcriber-wheel-check" dist/*.whl
      - name: Run unit, integration and UI tests
        run: python -X faulthandler -m pytest -q
