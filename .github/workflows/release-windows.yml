name: Publish Windows Installer

on:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"
      - "src/transcriber/**"
      - "Transcriber.spec"
      - "installer/windows/**"
      - "scripts/build_windows.ps1"
      - "release-notes/**"
      - ".github/workflows/release-windows.yml"

permissions:
  contents: write

jobs:
  publish:
    name: Build, verify and publish Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $Version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($LASTEXITCODE -ne 0 -or -not $Version) { throw "Could not read the project version." }
          "version=$Version" >> $env:GITHUB_OUTPUT
          "tag=v$Version" >> $env:GITHUB_OUTPUT

      - name: Check whether this release already exists
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ReleaseTags = gh release list --limit 1000 --json tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
              throw "Could not list GitHub Releases."
          }
          $Tag = "${{ steps.version.outputs.tag }}"
          $AlreadyPublished = @($ReleaseTags | Where-Object { $_.tagName -eq $Tag }).Count -gt 0
          "published=$($AlreadyPublished.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($AlreadyPublished) {
              Write-Host "Release $Tag already exists; leaving it unchanged."
          }

      - name: Install Inno Setup 6
        if: steps.existing.outputs.published != 'true'
        run: choco install innosetup --yes --no-progress

      - name: Install test and packaging dependencies
        if: steps.existing.outputs.published != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,documents]"

      - name: Run lint, formatting, compilation and test suite
        if: steps.existing.outputs.published != 'true'
        shell: pwsh
        run: |
          python -m ruff check src tests
          if ($LASTEXITCODE -ne 0) { throw "Ruff lint failed." }
          python -m ruff format --check src/transcriber/audio/imports.py
          if ($LASTEXITCODE -ne 0) { throw "Audio import format check failed." }
          python -m ruff format --check src/transcriber/ui/components/workspace_popups.py
          if ($LASTEXITCODE -ne 0) { throw "Workspace popup format check failed." }
          python -m ruff format --check tests/unit/test_media_import.py
          if ($LASTEXITCODE -ne 0) { throw "Media import test format check failed." }
          python -m ruff format --check tests/unit/test_dispatcher_future_lifecycle.py
          if ($LASTEXITCODE -ne 0) { throw "Dispatcher test format check failed." }
          python -m compileall -q src tests
          if ($LASTEXITCODE -ne 0) { throw "Python compilation failed." }
          python -X faulthandler -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw "The test suite failed; refusing to publish." }

      - name: Build Windows application and installer
        if: steps.existing.outputs.published != 'true'
        shell: pwsh
        run: .\scripts\build_windows.ps1

      - name: Verify GUI executable and installer
        if: steps.existing.outputs.published != 'true'
        shell: pwsh
        run: |
          $Executable = "dist/Transcriber/Transcriber.exe"
          $Installer = "release/Transcriber-Setup-${{ steps.version.outputs.version }}-x64.exe"
          if (-not (Test-Path $Executable)) { throw "Missing GUI executable: $Executable" }
          if (-not (Test-Path $Installer)) { throw "Missing installer: $Installer" }
          if ((Get-Item $Installer).Length -lt 10MB) { throw "Installer output is unexpectedly small." }

          @'
          import struct
          from pathlib import Path

          executable = Path("dist/Transcriber/Transcriber.exe")
          data = executable.read_bytes()
          pe_offset = struct.unpack_from("<I", data, 0x3C)[0]
          if data[pe_offset:pe_offset + 4] != b"PE\0\0":
              raise SystemExit("Invalid PE executable")
          subsystem = struct.unpack_from("<H", data, pe_offset + 24 + 68)[0]
          if subsystem != 2:
              raise SystemExit(f"Expected Windows GUI subsystem (2), got {subsystem}")
          print("Verified Windows GUI subsystem.")
          '@ | python -

      - name: Create GitHub Release and attach installer
        if: steps.existing.outputs.published != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Tag = "${{ steps.version.outputs.tag }}"
          $Version = "${{ steps.version.outputs.version }}"
          $Installer = "release/Transcriber-Setup-$Version-x64.exe"
          $ReleaseNotes = "release-notes/v$Version.md"
          if (-not (Test-Path -LiteralPath $ReleaseNotes -PathType Leaf)) {
              throw "Missing versioned release notes: $ReleaseNotes"
          }
          gh release create $Tag $Installer --target $env:GITHUB_SHA --title "Transcriber $Version" --notes-file $ReleaseNotes --latest
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release upload failed." }
          $Assets = gh release view $Tag --json assets --jq ".assets[].name"
          if ($LASTEXITCODE -ne 0) { throw "Could not verify the published release assets." }
          if ($Assets -notcontains "Transcriber-Setup-$Version-x64.exe") {
              throw "The installer asset is missing from the created release."
          }
